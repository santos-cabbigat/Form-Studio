<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f8fa"><title>Form Studio — Visual UI builder</title><link rel="stylesheet" href="studio.css?v=update1"></head><body class="locked"><section id="ownerEntrance"><form>
  <h1>Oon Jai Form Studio</h1>
  <label id="ownerEmailLabel">Owner email<input type="email" name="email" autocomplete="username" required></label>
  <label id="accessCodeLabel" hidden>Private recovery code<input name="code" autocomplete="off" spellcheck="false" autocapitalize="none"></label>
  <label id="pwdLabel" for="studio-password">Studio password</label><div class="passwordField"><input id="studio-password" type="password" name="password" autocomplete="current-password" required><button type="button" class="eyeToggle" data-eye="password" aria-controls="studio-password" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eyeSlash" d="m3 3 18 18"/></svg></button></div>
  <small id="authHint" hidden>Use at least 8 characters.</small>
  <div id="repeatLabel" hidden><label for="studio-confirm">Confirm new password</label><div class="passwordField"><input id="studio-confirm" type="password" name="confirm" autocomplete="new-password"><button type="button" class="eyeToggle" data-eye="confirm" aria-controls="studio-confirm" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eyeSlash" d="m3 3 18 18"/></svg></button></div></div>
  <button class="btn primary" type="submit">Sign in</button>
  <p role="status" aria-live="polite"></p>
  <div id="accessModes" hidden><button type="button" data-auth="setup" hidden>Set up Studio password</button><button type="button" data-auth="recover" hidden>Recover Studio password</button></div>
  <button type="button" data-auth="login" hidden>Back to sign in</button>
<section id="recoveryReceipt" hidden><b>Save your Studio recovery code</b><p>Keep this private code in your password manager. It lets you set a new Studio password.</p><output></output><button class="btn primary" type="button" id="finishAccess">I saved it · Continue</button></section></form></section>
<header class="top"><div class="brand"><span class="mark"><i></i><i></i><i></i></span>Form Studio</div><div class="crumb"><span>Workspace</span><b>/</b><button id="projectName" title="Rename project"></button></div><div class="topActions"><button type="button" data-cmd="website-settings" class="siteSettingsLink" aria-haspopup="dialog" title="Settings" aria-label="Settings">⚙ <span>Settings</span></button><div class="undoPair"><button data-cmd="undo" title="Undo" aria-label="Undo"></button><button data-cmd="redo" title="Redo" aria-label="Redo"></button></div><button class="btn" data-cmd="preview"></button><button class="btn primary" data-cmd="export"></button></div></header>
<div class="studioToolbar"><nav class="tabs" aria-label="Design tools" id="tabs"></nav><div class="fileBar"><a class="btn guideLink" href="Form-Studio-Handbook.pdf" download="Form-Studio-Handbook.pdf">Download guide</a><button class="btn filesLaunch" data-cmd="files">Files</button><button class="btn" id="railToggle" aria-pressed="false">Shrink library</button><button class="btn" id="inspectorToggle">Inspector</button></div></div>
<main><aside class="library" id="library"></aside><section class="workspace"><div class="canvasHead"><button id="pageBtn"></button><div class="deviceGroup" id="devices"></div></div><section id="stage" aria-label="Design canvas"><div id="sheetWrap"><div class="sheetLabel"><span id="boardLabel"></span><span id="boardSize"></span></div><div id="sheet"></div></div><div class="floatTools"><button id="selectTool" title="Select and move" aria-label="Select and move"></button><button id="multiTool" data-cmd="multi" aria-label="Multi-select layers" title="Multi-select layers">Multi-select</button><button id="arrangeTool" data-cmd="arrange" title="Arrange selection (A)">Arrange</button><button id="guideTool" data-cmd="guides" aria-pressed="true" title="Show alignment guides and snap while dragging or resizing (hold Alt to bypass)">Guides</button><button id="panTool" title="Pan canvas" aria-label="Pan canvas"></button><i></i><button id="less" title="Zoom out" aria-label="Zoom out">Zoom −</button><button id="zoom" title="Fit canvas">Fit</button><button id="more" title="Zoom in" aria-label="Zoom in">Zoom +</button></div></section><footer class="foot"><span><i></i><span id="saveStatus" role="status">Saved on this device</span></span><span class="offlineBox"><span id="offlineStatus" role="status"></span><button type="button" data-offline-retry hidden>Retry</button></span><button class="cloudLaunch" data-cmd="cloud">Cloud workspace</button><button id="sizeBtn"></button></footer></section><aside class="inspector" id="inspector"></aside></main><div id="grip" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0"></div>
<div class="mobileTools"><button id="openLib">Insert</button><button id="openProps">Inspector</button></div><div id="overlay"></div><div id="toast" role="status"></div>
