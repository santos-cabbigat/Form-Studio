<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f8fa"><title>Form Studio — Visual UI builder</title><link rel="stylesheet" href="studio.css"></head><body>
<header class="top"><div class="brand"><span class="mark"><i></i><i></i><i></i></span>Form Studio</div><div class="crumb"><span>Workspace</span><b>/</b><button id="projectName" title="Rename project"></button></div><div class="topActions"><div class="undoPair"><button data-cmd="undo" title="Undo" aria-label="Undo"></button><button data-cmd="redo" title="Redo" aria-label="Redo"></button></div><button class="btn" data-cmd="preview"></button><button class="btn primary" data-cmd="export"></button></div></header>
<nav class="tabs" aria-label="Design tools" id="tabs"></nav>
<main><aside class="library" id="library"></aside><section class="workspace"><div class="canvasHead"><button id="pageBtn"></button><div class="deviceGroup" id="devices"></div></div><section id="stage" aria-label="Design canvas"><div id="sheetWrap"><div class="sheetLabel"><span id="boardLabel"></span><span id="boardSize"></span></div><div id="sheet"></div></div><div class="floatTools"><button id="selectTool" title="Select and move" aria-label="Select and move"></button><button id="multiTool" data-cmd="multi" aria-label="Multi-select layers" title="Multi-select layers">⊞</button><button id="panTool" title="Pan canvas" aria-label="Pan canvas"></button><i></i><button id="less" title="Zoom out" aria-label="Zoom out">−</button><button id="zoom" title="Fit canvas">Fit</button><button id="more" title="Zoom in" aria-label="Zoom in">+</button></div></section><footer class="foot"><span><i></i><span id="saveStatus">Saved on this device</span></span><button class="cloudLaunch" data-cmd="cloud">Cloud workspace</button><button id="sizeBtn"></button></footer></section><aside class="inspector" id="inspector"></aside></main>
<div class="mobileTools"><button id="openLib">Insert</button><button id="openProps">Inspector</button></div><div id="overlay"></div><div id="toast" role="status"></div>
<script src="art.js"></script><script src="icons.js"></script><script src="model.js"></script><script src="runtime.js"></script><script src="selection.js"></script><script src="cloud.js?v=2"></script><script src="studio.js"></script></body></html>
